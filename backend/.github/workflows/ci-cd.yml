name: CI/CD Pipeline

on:
    push:
        branches: [dev]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout code
            - uses: actions/checkout@v4

            # 2. Setup Node.js
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            # 3. Install dependencies
            - run: npm install

            # 4. Optional: Add a dummy build if your package.json has no build
            - run: |
                  if ! npm run | grep -q "build"; then
                    echo "No build script, skipping build step."
                  else
                    npm run build
                  fi

            # 5. Deploy to Vercel
            - name: Deploy to Vercel
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  npx vercel --prod --confirm --token $VERCEL_TOKEN
